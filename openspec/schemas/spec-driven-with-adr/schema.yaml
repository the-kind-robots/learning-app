name: spec-driven-with-adr
version: 1
description: Default OpenSpec workflow - proposal → specs → [design] → [adr] → tasks; design and adr optional (ADRs persist at <repo>/adr/)
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal: WHY this change is needed. Aim for under 2000
      characters (guidance, not a hard rule). No Context or Goals sections.


      Sections:

      - **Why**: 1-2 sentences. The problem and why now.

      - **Changes**: Bullet list of changes. Mark breaking ones **BREAKING**.

      - **Capabilities**: New (each becomes `specs/<kebab-name>/spec.md`) and
      Modified (existing `openspec/specs/<name>/` whose REQUIREMENTS change).
      Research `openspec/specs/` first; every listed capability needs a spec
      file.

      - **Decisions**: One line per choice made, with the rejected
      alternative. Behaviour itself lives only in specs — link, never restate.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include the full
      requirement block (the openspec CLI replaces the whole block at archive
      and `openspec validate` refuses a MODIFIED that drops scenarios). Keep
      unchanged scenarios verbatim and terse; put new prose only where
      behaviour changes.

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Size: aim for under 3000 characters per capability delta (guidance, not a
      hard rule). If it runs over, split the requirement or drop prose —
      scenarios carry the behaviour. The aim does NOT apply to MODIFIED
      requirement blocks: those are restated whole, however long.


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Optional technical design (cross-cutting changes or a new ADR only)
    template: design.md
    instruction: >
      design.md is OPTIONAL. Create it only when the change is cross-cutting
      (several modules/services, new pattern, data-model migration) or will
      record a new ADR. Otherwise skip it — the proposal's Decisions section
      is enough.


      Prior decisions: list <repo>/adr/ and walk each ADR's Supersedes field;
      only in-force ADRs constrain this design. Never edit an ADR — flag one
      that needs revisiting under Risks; the adr step records a superseding
      ADR.


      Sections (template): **Decisions** — key choices, why X over Y;
      **Risks** — `[Risk] → Mitigation`. No Context, Goals or restated
      behaviour. Aim for under 2000 characters (guidance, not a hard rule).
    requires:
      - proposal
  - id: adr
    generates: adr/*.md
    description: Architecture Decision Records distilled from the proposal's Decisions and design.md (if present) for future reference
    template: adr.md
    instruction: >
      Distill significant decisions from the proposal's Decisions (and
      design.md, if present) into Architecture Decision Records. An ADR is
      REQUIRED when the proposal's Decisions introduce an architectural
      decision (see the bar in Process step 2); a change without one needs
      none. An ADR is born in its change: write it to
      openspec/changes/<change>/adr/, beside proposal.md and design.md.
      Archiving moves it to <repo>/adr/ — the target repository's top-level
      adr/ folder beside openspec/ — where accepted ADRs accumulate and
      persist across changes. An ADR still sitting in an unarchived change is
      a proposed decision, not yet one of the accumulated set.


      IRON RULE — ADRs are immutable once accepted. You MUST NOT edit a prior
      ADR file under any circumstance (not its Status, not its body, not its
      date — nothing). To change a previously accepted decision, record a NEW
      ADR whose Status is "accepted, supersedes ADR-NNNN" and whose
      `Supersedes:` field names the prior one. Design consumers derive what is
      currently in force by walking Supersedes links across <repo>/adr/ — the
      prior ADR's contents stay frozen as a historical record.


      Process:


      1. Read every existing ADR in <repo>/adr/. Build the supersession graph
      from each ADR's Supersedes field. Note the highest sequence number in
      use.


      2. Re-read design.md (or the proposal's Decisions when there is no
      design.md). Identify decisions that meet ALL of these:

      - Establish a long-term architectural commitment (pattern, technology,
      boundary, contract) — not a tactical implementation detail.

      - Will affect future changes beyond this one.

      - Either aren't already captured by a currently-in-force ADR, OR
      intentionally diverge from one (in which case the new ADR supersedes the
      prior).


      3. For each qualifying decision, create a NEW file at
      adr/NNNN-kebab-title.md inside this change directory, where NNNN is a
      4-digit sequence one greater than the highest number in <repo>/adr/. Use
      the template (MADR-short). If this decision replaces a prior in-force
      ADR, set Status to "accepted, supersedes ADR-NNNN", populate the
      `Supersedes:` field, and explain in Context why the prior decision is
      being revisited. Do NOT touch the prior ADR's file — leave it exactly as
      it was.


      4. If nothing meets the bar, do not invent ADRs. This artifact is
      satisfied by any file in this change's adr/, so a change with no
      qualifying decision leaves it open.


      Filename convention: NNNN-kebab-title.md (e.g.,
      0042-use-postgres-for-catalog.md). Sequence is monotonic across the
      whole repo and never reused.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work. Aim for
      under 1500 characters (guidance, not a hard rule) — a checklist, no
      prose.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses

      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      Guidelines:

      - Group related tasks under ## numbered headings

      - Each task MUST be a checkbox: `- [ ] X.Y Task description`

      - Tasks should be small enough to complete in one session

      - Order tasks by dependency (what must be done first?)


      Example:

      ```

      ## 1. Setup


      - [ ] 1.1 Create new module structure

      - [ ] 1.2 Add dependencies to package.json


      ## 2. Core Implementation


      - [ ] 2.1 Implement data export function

      - [ ] 2.2 Add CSV formatting utilities

      ```


      When the change has an ADR, a task MUST reference it (e.g. "honors
      ADR-NNNN"). A change with no ADR needs no such task.


      Reference specs for what to build, design for how to build it, and
      <repo>/adr/ for the durable architectural commitments to honor.

      Each task should be verifiable - you know when it's done.
    requires:
      - specs
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
