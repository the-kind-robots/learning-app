name: Staging smoke
on:
  pull_request:
    branches: [master]

jobs:
  # A required check that never reports blocks the merge forever, and a path
  # filter on the trigger is exactly how a check never reports (#204). So the
  # workflow fires on every PR and decides here: a skipped job satisfies
  # branch protection, a never-started workflow does not.
  changes:
    name: Detect infra changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(infra/|\.github/workflows/(staging-smoke|build-jar)\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # The jar the runbook delivers, built by the shared recipe (#237). A called
  # workflow inherits nothing implicit, so the needs/if gate lives here: the
  # build runs exactly when the smoke will.
  build:
    name: Build app jar
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    uses: ./.github/workflows/build-jar.yml

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    # Image build + boot + smoke ~5 min (the jar build has its own job now);
    # 15 leaves headroom without letting a wedged systemd boot hold the
    # runner an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v4.3.0
        with:
          name: app-jar
          path: target

      # The systemd-in-docker incantation (cgroupns=host, rw cgroup bind,
      # CAP_SYS_ADMIN, unconfined seccomp/apparmor) lives inside run.sh and is
      # allowed on GitHub-hosted runners: rootful docker, no restrictive
      # seccomp policy on the daemon.
      - name: Run the container smoke
        shell: bash
        run: bash infra/staging/run.sh 2>&1 | tee smoke-output.log

      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: staging-smoke-output
          path: smoke-output.log
          if-no-files-found: ignore
