name: Integration
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'resources/**'
      - '.codex/**'
      - 'codex/**'
      - '.gitignore'
      - 'shadow-cljs.edn'
      - 'deps.edn'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'resources/**'
      - '.codex/**'
      - 'codex/**'
      - '.gitignore'
      - 'shadow-cljs.edn'
      - 'deps.edn'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - id: cache-clojure
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
          restore-keys: |
            clojure-

      - run: npm ci
      - name: Run client tests
        run: |
          npx shadow-cljs compile node-test
          node target/node-tests.js

      - uses: actions/cache/save@v6.1.0
        if: ${{ always() && steps.cache-clojure.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
