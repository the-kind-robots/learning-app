name: Integration
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'shadow-cljs.edn'
      - 'deps.edn'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'shadow-cljs.edn'
      - 'deps.edn'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration.yml'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v6.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: DeLaGuardo/setup-clojure@13.5.2
        with:
          cli: latest

      - id: cache-clojure
        uses: actions/cache/restore@v5.0.2
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
          restore-keys: |
            clojure-

      - run: npm ci
      - name: Run client tests
        run: |
          npx shadow-cljs compile node-test
          node target/node-tests.js

      - uses: actions/cache/save@v5.0.2
        if: ${{ always() && steps.cache-clojure.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
