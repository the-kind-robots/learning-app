name: Integration
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'resources/**'
      - '.codex/**'
      - 'codex/**'
      - '.gitignore'
      - 'shadow-cljs.edn'
      - 'deps.edn'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'test/browser/**'
      - 'playwright.config.js'

jobs:
  # A required check that never reports blocks the merge forever, and a path
  # filter on the trigger is exactly how a check never reports (#204). So the
  # workflow fires on every PR and decides here: a skipped job satisfies
  # branch protection, a never-started workflow does not.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD             | grep -qE '^(src/|resources/|\.codex/|codex/|\.github/workflows/|\.gitignore$|shadow-cljs\.edn$|deps\.edn$|package\.json$|package-lock\.json$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BASE" HEAD             | grep -qE '^(src/|resources/|\.github/workflows/|shadow-cljs\.edn$|deps\.edn$|package\.json$|package-lock\.json$|test/browser/|playwright\.config\.js$)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    needs: changes
    # not cancelled(): on push the changes job is skipped, and a job whose
    # needs were skipped is skipped too unless told otherwise.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.relevant == 'true') }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - id: cache-clojure
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
          restore-keys: |
            clojure-

      - run: npm ci
      - name: Run client tests
        run: |
          npx shadow-cljs compile node-test
          node target/node-tests.js

      - uses: actions/cache/save@v6.1.0
        if: ${{ always() && steps.cache-clojure.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}

  browser-tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.browser == 'true') }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - id: cache-clojure
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
          restore-keys: |
            clojure-

      - run: npm ci
      - run: npx shadow-cljs compile app

      # The runner image ships Google Chrome; `channel: "chrome"` in
      # playwright.config.js picks it up, so no browser download is needed.
      - name: Start backend
        run: |
          LEARNING_APP__PORT=8301 LEARNING_APP__DB_PATH="$PWD/test-app.db"             clojure -M:dev -m core > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8301/ && exit 0
            sleep 1
          done
          echo "backend never answered on 8301"
          cat backend.log
          exit 1

      - name: Run browser tests
        run: npm run test:browser

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            backend.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/cache/save@v6.1.0
        if: ${{ always() && steps.cache-clojure.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
