name: Format

# Fails when a Clojure file differs from zprint's output with .zprint.edn
# (#664). No path filter: a few seconds per run, and a check that always
# reports can be made required.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zprint:
    name: zprint
    runs-on: ubuntu-latest
    env:
      # The version the Edit/Write hook formats with; a different zprint
      # formats differently.
      ZPRINT_VERSION: 1.3.0
      ZPRINT_SHA256: 3447ad2fe18847d884a1555e8384763c461b55b8959063a7454d68e76fe2071e
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install zprint
        run: |
          curl -fsSL -o /usr/local/bin/zprint \
            "https://github.com/kkinnear/zprint/releases/download/${ZPRINT_VERSION}/zprintl-${ZPRINT_VERSION}"
          echo "${ZPRINT_SHA256}  /usr/local/bin/zprint" | sha256sum -c -
          chmod +x /usr/local/bin/zprint

      - name: Check formatting
        run: scripts/zprint_check.sh
