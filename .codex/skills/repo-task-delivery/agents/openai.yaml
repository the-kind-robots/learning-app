interface:
  display_name: "Repo Task Delivery"
  short_description: "Turn any likely repo change into issue -> OpenSpec -> implementation -> PR/merge."
  default_prompt: "When a user reports a problem, warning, bug, improvement, or proposed repo change that is likely to land as a commit, take it through the standard workflow: create the GitHub issue/project item, start the OpenSpec change, implement it, verify it, and deliver it through PR and merge."
policy:
  allow_implicit_invocation: true
