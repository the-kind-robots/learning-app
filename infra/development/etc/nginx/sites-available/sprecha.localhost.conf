# Example generation spends money at the LLM provider on every request. The
# limit lives here as well as in production so it is exercised on the stand
# instead of first being met by users.
limit_req_zone $binary_remote_addr zone=examples:10m rate=30r/m;

# `add_header ... always` fires on every response, so the value is emptied for
# anything but a throttled one — nginx omits a header whose value is empty.
map $status $examples_retry_after {
    429     5;
    default "";
}

# The dev stand. Plain http on purpose: browsers resolve *.localhost to
# loopback themselves and treat it as a secure context, so Secure cookies
# and the service worker work without certificates. The Cloudflare tunnel
# (docs/dev/mobile-pwa-testing.md) feeds this same server from the phone's
# side — its origin points at http://127.0.0.1:80 with the Host header set
# to sprecha.localhost.
server {
    # Both stacks: browsers resolving *.localhost prefer ::1, and a vhost
    # absent from the IPv6 socket loses those requests to the default site.
    listen 80;
    listen [::]:80;
    server_name sprecha.localhost;

    # Dev WebSocket
    location /shadow-cljs/ {
        proxy_pass http://localhost:9630/;

        # WebSocket specific headers: https://nginx.org/ru/docs/http/websocket.html
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 1h;
    }

    # Paid endpoint: throttled here, authenticated in the handler.
    location /api/examples {
        limit_req zone=examples burst=10 nodelay;
        limit_req_status 429;
        # The client reschedules its fetch task on Retry-After.
        add_header Retry-After $examples_retry_after always;

        proxy_pass http://localhost:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Declaring any proxy_set_header here stops the server-level stripping
        # from being inherited (#304), so repeat it.
        proxy_set_header X-Auth-CouchDB-UserName "";
        proxy_set_header X-Auth-CouchDB-Roles    "";
        proxy_set_header X-Auth-CouchDB-Token    "";
    }

    # Push pokes (ADR-0009): a WebSocket, silent while nothing changes.
    location /api/sync/updates {
        proxy_pass http://localhost:8083/api/sync/updates;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Clear client's proxy-auth header, not allowed
    proxy_set_header X-Auth-CouchDB-UserName "";
    proxy_set_header X-Auth-CouchDB-Roles    "";
    proxy_set_header X-Auth-CouchDB-Token    "";

    # CouchDB dictionary-db (public read-only, no auth required)
    location /db/dictionary-db/ {
        proxy_pass http://localhost:5984/dictionary-db/;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /db/ {
        # 1. Ask backend to validate request
        auth_request /auth/check;

        # 2. Take user/roles from the auth subrequest response headers
        #    nginx lowercases header names and replaces - with _ for $upstream_http_* vars.
        #    X-Auth-UserName  → $upstream_http_x_auth_username
        #    X-Auth-Roles     → $upstream_http_x_auth_roles
        #    X-Auth-Token     → $upstream_http_x_auth_token
        auth_request_set $couch_user  $upstream_http_x_auth_username;
        auth_request_set $couch_roles $upstream_http_x_auth_roles;
        auth_request_set $couch_token $upstream_http_x_auth_token;

        # 3. Inject CouchDB proxy-auth headers
        proxy_set_header X-Auth-CouchDB-UserName $couch_user;
        proxy_set_header X-Auth-CouchDB-Roles    $couch_roles;
        proxy_set_header X-Auth-CouchDB-Token    $couch_token;

        # 4. Proxy to CouchDB
        proxy_pass http://localhost:5984/;

        proxy_redirect off;
        # Proxy buffering must be disabled, or continuous replication will not function correctly behind nginx.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/check {
        internal;
        proxy_pass http://localhost:8083/auth/check;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location / {
        proxy_pass http://localhost:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
