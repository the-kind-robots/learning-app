# Example generation spends money at the LLM provider on every request. The
# limit lives here as well as in production so it is exercised on the stand
# instead of first being met by users.
limit_req_zone $binary_remote_addr zone=examples:10m rate=30r/m;

# Invite requests answer anyone without an account: a request, a status
# poll, the operator's pages. The backend allows 5 requests a day; this
# keeps floods of the other endpoints off it.
limit_req_zone $invite_caller zone=invites:10m rate=30r/m;

# Who asks. The tunnel proxies from 127.0.0.1, so the socket names nobody;
# the tunnel names its caller in CF-Connecting-IP, which Cloudflare writes
# itself. The header counts only from loopback, where the tunnel connects:
# anyone else could write it.
map "$remote_addr:$http_cf_connecting_ip" $invite_address {
    "~^(127\.0\.0\.1|::1):(?<tunnel_caller>.+)$" $tunnel_caller;
    default                                     $remote_addr;
}

# One IPv6 subscriber usually holds a whole /64, so the throttle counts the
# first four groups, as the backend does. A /64 written with `::` inside it
# falls back to the full address.
map $invite_address $invite_caller {
    "~^(?<network>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $network;
    default $invite_address;
}

# The same /db/ rules as production (GH-796), so the stand meets them first.
limit_conn_zone $invite_address zone=couchdb_conn:10m;

# What a one-shot PouchDB pass asks of /db/ (ADR-0007), read off its HTTP
# adapter and the stand's access log: the server root, the database, the plain
# change feed, the three bulk endpoints, its checkpoints. Reading one document
# is the adapter's fallback for _bulk_get. Everything else is refused before
# authentication.
map "$request_method $uri" $db_route {
    default                                                         refused;
    "~^GET /db/$"                                                   read;
    "~^GET /db/userdb-[0-9]+/?$"                                    read;
    "~^GET /db/userdb-[0-9]+/_changes$"                             read;
    "~^POST /db/userdb-[0-9]+/(_revs_diff|_bulk_docs|_bulk_get)$"   write;
    "~^GET /db/userdb-[0-9]+/_local/[^/]+$"                         read;
    "~^PUT /db/userdb-[0-9]+/_local/[^/]+$"                         checkpoint;
    "~^GET /db/userdb-[0-9]+/[^_/][^/]*$"                           read;
}

# A checkpoint write declares a length under 10 KB, or is refused.
map "$db_route $content_length" $db_refused {
    default                         0;
    "~^refused "                    1;
    "~^checkpoint [0-9]{1,4}$"      0;
    "~^checkpoint "                 1;
}

# One-shot passes read the plain feed; a held feed is refused (ADR-0007).
map $arg_feed $db_feed_refused {
    default 1;
    ""      0;
    normal  0;
}

# A throttled answer is not logged.
map $status $loggable {
    429     0;
    default 1;
}

# `add_header ... always` fires on every response, so the value is emptied for
# anything but a throttled one that names no delay of its own — nginx omits a
# header whose value is empty. A 429 from the application carries its own
# delay, and a second, fixed one would contradict it: the 5 is for nginx's
# own refusals, which have no upstream.
map "$status:$upstream_http_retry_after" $throttled_retry_after {
    "429:"  5;
    default "";
}

# A request the tunnel forwarded carries CF-Connecting-IP; one from this
# machine does not. Access adds Cf-Access-Jwt-Assertion to what it lets
# through, so a tunnel request without it is refused: should the Access
# application go, the watch closes instead of opening to everyone.
map "$http_cf_connecting_ip:$http_cf_access_jwt_assertion" $devtools_refused {
    "~^.+:$" 1;
    default  "";
}

# The dev stand. Plain http on purpose: browsers resolve *.localhost to
# loopback themselves and treat it as a secure context, so Secure cookies
# and the service worker work without certificates. The phone comes in over
# the Cloudflare tunnel (docs/dev/mobile-pwa-testing.md), which terminates TLS
# and proxies here as plain http on 127.0.0.1:80 with the Host header set to
# sprecha.localhost.
server {
    # Both stacks: browsers resolving *.localhost prefer ::1, and a vhost
    # absent from the IPv6 socket loses those requests to the default site.
    listen 80;
    listen [::]:80;
    server_name sprecha.localhost;
    # Redirects nginx writes itself (/shadow-cljs → /shadow-cljs/) stay
    # relative: an absolute one names sprecha.localhost, which the phone
    # cannot reach.
    absolute_redirect off;

    access_log /var/log/nginx/access.log combined if=$loggable;

    # Dev WebSocket. The watch runs code it is sent, so from the tunnel only
    # past Cloudflare Access, which lets the owner alone into /shadow-cljs.
    location /shadow-cljs/ {
        if ($devtools_refused) {
            return 403;
        }

        proxy_pass http://localhost:9630/;
        include snippets/couchdb-proxy-auth-strip.conf;

        # WebSocket specific headers: https://nginx.org/ru/docs/http/websocket.html
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 1h;
    }

    # Paid endpoint: throttled here, authenticated in the handler.
    location /api/examples {
        limit_req zone=examples burst=10 nodelay;
        limit_req_status 429;
        # The client pauses its example requests for Retry-After.
        add_header Retry-After $throttled_retry_after always;

        proxy_pass http://127.0.0.1:8083;
        # Longer than the longest generation: every attempt at its full
        # timeout, plus the dictionary reads. Shorter, and nginx answers 504
        # for an example the provider was already paid for.
        proxy_read_timeout 100s;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Anonymous endpoint: throttled here, limited per day in the backend.
    location /api/invite-requests {
        limit_req zone=invites burst=10 nodelay;
        limit_req_status 429;
        add_header Retry-After $throttled_retry_after always;
        # A request body is a hash, two numbers and a note of 500 characters,
        # up to 12 bytes each when a client writes them as JSON escapes.
        client_max_body_size 8k;

        proxy_pass http://127.0.0.1:8083;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $invite_address;
    }

    # Push pokes (ADR-0009): a WebSocket, silent while nothing changes.
    location /api/sync/updates {
        proxy_pass http://127.0.0.1:8083/api/sync/updates;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Clear client's proxy-auth header, not allowed. Only reaches locations that
    # declare no proxy_set_header of their own — every location below declares
    # some, so each includes the same snippet explicitly (GH-304).
    include snippets/couchdb-proxy-auth-strip.conf;

    location /db/ {
        # 0. Refuse what replication never asks, before the auth check.
        #    CouchDB up to 3.5.2 measures a compressed body before
        #    decompressing it (CVE-2026-90797).
        if ($http_content_encoding) {
            return 415;
        }
        if ($db_refused) {
            return 403;
        }
        if ($db_feed_refused) {
            return 403;
        }
        client_max_body_size 1m;
        limit_conn couchdb_conn 20;
        limit_conn_status 429;

        # 1. Ask backend to validate request
        auth_request /auth/check;

        # 2. Take user/roles from the auth subrequest response headers
        #    nginx lowercases header names and replaces - with _ for $upstream_http_* vars.
        #    X-Auth-UserName  → $upstream_http_x_auth_username
        #    X-Auth-Roles     → $upstream_http_x_auth_roles
        #    X-Auth-Token     → $upstream_http_x_auth_token
        auth_request_set $couch_user  $upstream_http_x_auth_username;
        auth_request_set $couch_roles $upstream_http_x_auth_roles;
        auth_request_set $couch_token $upstream_http_x_auth_token;

        # 3. Inject CouchDB proxy-auth headers. This assignment replaces whatever
        #    the client sent, so it is the strip for this location — including
        #    the snippet here would send each header twice.
        proxy_set_header X-Auth-CouchDB-UserName $couch_user;
        proxy_set_header X-Auth-CouchDB-Roles    $couch_roles;
        proxy_set_header X-Auth-CouchDB-Token    $couch_token;

        # 4. Proxy to CouchDB
        proxy_pass http://localhost:5984/;

        proxy_redirect off;
        # Proxy buffering must be disabled, or continuous replication will not function correctly behind nginx.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8083/auth/check;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
