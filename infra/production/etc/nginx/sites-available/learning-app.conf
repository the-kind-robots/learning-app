limit_req_zone $binary_remote_addr zone=couchdb:10m rate=40r/s;

# Example generation spends money at the LLM provider on every request, so it
# gets its own budget instead of sharing the replication zone: 40r/s is sized
# for _changes and _bulk_get bursts, and replication would eat the allowance.
limit_req_zone $binary_remote_addr zone=examples:10m rate=30r/m;

# Invite requests answer anyone without an account: a request, a status
# poll, the operator's pages. The backend allows 5 requests a day; this
# keeps floods of the other endpoints off it.
limit_req_zone $invite_caller zone=invites:10m rate=30r/m;

# One IPv6 subscriber usually holds a whole /64, so the throttle counts the
# first four groups, as the backend does. A /64 written with `::` inside it
# falls back to the full address.
map $remote_addr $invite_caller {
    "~^(?<network>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $network;
    default $binary_remote_addr;
}

# `add_header ... always` fires on every response, so the value is emptied for
# anything but a throttled one that names no delay of its own — nginx omits a
# header whose value is empty. Without the map, successful answers would carry
# Retry-After too. A 429 from the application carries the provider's delay, and
# a second, fixed one would contradict it: the 5 is for nginx's own refusals,
# which have no upstream.
map "$status:$upstream_http_retry_after" $examples_retry_after {
    "429:"  5;
    default "";
}

server {
    listen 80;
    server_name sprecha.de www.sprecha.de;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sprecha.de www.sprecha.de;

    ssl_certificate /etc/nginx/ssl/sprecha.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sprecha.de/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8083;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prevent clients from spoofing CouchDB proxy-auth headers. Only reaches
    # locations that declare no proxy_set_header of their own — every location
    # here declares some, so each includes the same snippet explicitly (GH-304).
    include snippets/couchdb-proxy-auth-strip.conf;

    # CouchDB user databases (authenticated via session cookie)
    location /db/ {
        auth_request /auth/check;

        # X-Auth-UserName  → $upstream_http_x_auth_username
        # X-Auth-Roles     → $upstream_http_x_auth_roles
        # X-Auth-Token     → $upstream_http_x_auth_token
        auth_request_set $couch_user  $upstream_http_x_auth_username;
        auth_request_set $couch_roles $upstream_http_x_auth_roles;
        auth_request_set $couch_token $upstream_http_x_auth_token;

        # This assignment replaces whatever the client sent, so it is the strip
        # for this location — including the snippet here would send each header
        # twice.
        proxy_set_header X-Auth-CouchDB-UserName $couch_user;
        proxy_set_header X-Auth-CouchDB-Roles    $couch_roles;
        proxy_set_header X-Auth-CouchDB-Token    $couch_token;

        proxy_pass http://127.0.0.1:5984/;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=couchdb burst=120;
        limit_req_status 429;
    }

    # Paid endpoint: throttled here, authenticated in the handler.
    location /api/examples {
        limit_req zone=examples burst=10 nodelay;
        limit_req_status 429;
        # The client pauses its example requests for Retry-After; without the
        # header it backs off on its own timetable.
        add_header Retry-After $examples_retry_after always;

        proxy_pass http://127.0.0.1:8083;
        # Longer than the longest generation: every attempt at its full
        # timeout, plus the dictionary reads. Shorter, and nginx answers 504
        # for an example the provider was already paid for.
        proxy_read_timeout 100s;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Anonymous endpoint: throttled here, limited per day in the backend.
    location /api/invite-requests {
        limit_req zone=invites burst=10 nodelay;
        limit_req_status 429;
        # A request body is a hash and two numbers.
        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8083;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sync/updates {
        proxy_pass http://127.0.0.1:8083/api/sync/updates;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # An idle poke socket is silent for a long time; the default 60s
        # would cut it and put clients into a reconnect loop.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8083/auth/check;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
}
