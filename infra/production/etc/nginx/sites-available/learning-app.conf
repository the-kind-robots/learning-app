limit_req_zone $binary_remote_addr zone=couchdb:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=couchdb_conn:10m;

# What a one-shot PouchDB pass asks of /db/ (ADR-0007), read off its HTTP
# adapter and the stand's access log: the server root, the database, the plain
# change feed, the three bulk endpoints, its checkpoints. Reading one document
# is the adapter's fallback for _bulk_get. Everything else -- _find,
# _replicate, _purge, design documents, attachments, database creation, the
# server's own endpoints -- is refused before authentication (GH-796).
map "$request_method $uri" $db_route {
    default                                                         refused;
    "~^GET /db/$"                                                   read;
    "~^GET /db/userdb-[0-9]+/?$"                                    read;
    "~^GET /db/userdb-[0-9]+/_changes$"                             read;
    "~^POST /db/userdb-[0-9]+/(_revs_diff|_bulk_docs|_bulk_get)$"   write;
    "~^GET /db/userdb-[0-9]+/_local/[^/]+$"                         read;
    "~^PUT /db/userdb-[0-9]+/_local/[^/]+$"                         checkpoint;
    "~^GET /db/userdb-[0-9]+/[^_/][^/]*$"                           read;
}

# A checkpoint is a small document (about 1.4 KB on the heaviest learner);
# its write declares a length under 10 KB, or is refused. Every other route
# shares the location's body cap.
map "$db_route $content_length" $db_refused {
    default                         0;
    "~^refused "                    1;
    "~^checkpoint [0-9]{1,4}$"      0;
    "~^checkpoint "                 1;
}

# One-shot passes read the plain feed; a held longpoll or continuous feed is
# refused (ADR-0007).
map $arg_feed $db_feed_refused {
    default 1;
    ""      0;
    normal  0;
}

# A throttled answer is not logged, so a flood cannot fill the disk through
# the access log.
map $status $loggable {
    429     0;
    default 1;
}

# Example generation spends money at the LLM provider on every request, so it
# gets its own budget instead of sharing the replication zone: 40r/s is sized
# for _changes and _bulk_get bursts, and replication would eat the allowance.
limit_req_zone $binary_remote_addr zone=examples:10m rate=30r/m;

# Invite requests answer anyone without an account: a request, a status
# poll, the operator's pages. The backend allows 5 requests a day; this
# keeps floods of the other endpoints off it.
limit_req_zone $invite_caller zone=invites:10m rate=30r/m;

# One IPv6 subscriber usually holds a whole /64, so the throttle counts the
# first four groups, as the backend does. A /64 written with `::` inside it
# falls back to the full address.
map $remote_addr $invite_caller {
    "~^(?<network>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $network;
    default $binary_remote_addr;
}

# `add_header ... always` fires on every response, so the value is emptied for
# anything but a throttled one that names no delay of its own — nginx omits a
# header whose value is empty. Without the map, successful answers would carry
# Retry-After too. A 429 from the application carries its own delay, and a
# second, fixed one would contradict it: the 5 is for nginx's own refusals,
# which have no upstream.
map "$status:$upstream_http_retry_after" $throttled_retry_after {
    "429:"  5;
    default "";
}

server {
    listen 80;
    server_name sprecha.de www.sprecha.de;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sprecha.de www.sprecha.de;

    ssl_certificate /etc/nginx/ssl/sprecha.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sprecha.de/privkey.pem;

    access_log /var/log/nginx/access.log combined if=$loggable;

    # Who asks (GH-801). Behind the CDN the socket names its edge, and every
    # client of that edge would share one budget. The CDN names the client in
    # CF-Connecting-IP; the header counts only from the CDN's published
    # ranges, which learning-app-cdn-ranges.timer writes into the snippet.
    # Anyone else could write it. realip replaces $remote_addr in the first
    # phase, so every limit below and X-Real-IP count the client.
    #
    # A mask, not a file name: nginx fails on a missing file but includes
    # nothing for a mask that matches none. Until the timer's first fetch
    # writes the snippet there is none, and nobody is trusted. The package
    # cannot ship it, or a reinstall would overwrite the fetched list.
    real_ip_header CF-Connecting-IP;
    include snippets/learning-app-cdn-ranges*.conf;

    location / {
        proxy_pass http://127.0.0.1:8083;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prevent clients from spoofing CouchDB proxy-auth headers. Only reaches
    # locations that declare no proxy_set_header of their own — every location
    # here declares some, so each includes the same snippet explicitly (GH-304).
    include snippets/couchdb-proxy-auth-strip.conf;

    # CouchDB user databases (authenticated via session cookie)
    location /db/ {
        # Refusals run in the rewrite phase, before auth_request: a refused
        # request costs neither an auth check nor a CouchDB call.
        # CouchDB up to 3.5.2 measures a compressed body against its limit
        # before decompressing it (CVE-2026-90797); PouchDB never compresses.
        if ($http_content_encoding) {
            return 415;
        }
        if ($db_refused) {
            return 403;
        }
        if ($db_feed_refused) {
            return 403;
        }

        auth_request /auth/check;

        # X-Auth-UserName  → $upstream_http_x_auth_username
        # X-Auth-Roles     → $upstream_http_x_auth_roles
        # X-Auth-Token     → $upstream_http_x_auth_token
        auth_request_set $couch_user  $upstream_http_x_auth_username;
        auth_request_set $couch_roles $upstream_http_x_auth_roles;
        auth_request_set $couch_token $upstream_http_x_auth_token;

        # This assignment replaces whatever the client sent, so it is the strip
        # for this location — including the snippet here would send each header
        # twice.
        proxy_set_header X-Auth-CouchDB-UserName $couch_user;
        proxy_set_header X-Auth-CouchDB-Roles    $couch_roles;
        proxy_set_header X-Auth-CouchDB-Token    $couch_token;

        proxy_pass http://127.0.0.1:5984/;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        # A one-shot pass reads the plain feed and bulk batches; none of its
        # requests waits on CouchDB for long.
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The largest document with its revision history is about 3 KB, so a
        # batch of 100 stays near 300 KB. The cap is written down rather than
        # left to the default.
        client_max_body_size 1m;

        limit_req zone=couchdb burst=120;
        limit_req_status 429;
        # A pass holds a few requests at once; several tabs or devices behind
        # one address hold a few more.
        limit_conn couchdb_conn 20;
        limit_conn_status 429;
    }

    # Paid endpoint: throttled here, authenticated in the handler.
    location /api/examples {
        limit_req zone=examples burst=10 nodelay;
        limit_req_status 429;
        # The client pauses its example requests for Retry-After; without the
        # header it backs off on its own timetable.
        add_header Retry-After $throttled_retry_after always;

        proxy_pass http://127.0.0.1:8083;
        # Longer than the longest generation: every attempt at its full
        # timeout, plus the dictionary reads. Shorter, and nginx answers 504
        # for an example the provider was already paid for.
        proxy_read_timeout 100s;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Anonymous endpoint: throttled here, limited per day in the backend.
    location /api/invite-requests {
        limit_req zone=invites burst=10 nodelay;
        limit_req_status 429;
        add_header Retry-After $throttled_retry_after always;
        # A request body is a hash, two numbers and a note of 500 characters,
        # up to 12 bytes each when a client writes them as JSON escapes.
        client_max_body_size 8k;

        proxy_pass http://127.0.0.1:8083;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sync/updates {
        proxy_pass http://127.0.0.1:8083/api/sync/updates;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # An idle poke socket is silent for a long time; the default 60s
        # would cut it and put clients into a reconnect loop.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8083/auth/check;
        include snippets/couchdb-proxy-auth-strip.conf;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
}
