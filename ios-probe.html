<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>iOS probe</title>
<style>body{font:18px/1.5 system-ui;margin:16px}b{display:inline-block;min-width:9em}</style>
</head>
<body>
<h1>Проба хранилища</h1>
<p id="out"></p>
<button id="set">Записать метки</button>
<script>
  const has = (name) => document.cookie.split('; ').some((c) => c.startsWith(name + '='));
  const ls = () => { try { return localStorage.getItem('probe'); } catch (e) { return 'ошибка'; } };
  const show = () => {
    document.getElementById('out').innerHTML =
      '<b>Режим:</b> ' + (navigator.standalone ? 'установленное приложение' : 'Safari') + '<br>' +
      '<b>Кука постоянная:</b> ' + (has('probe_persistent') ? 'есть' : 'нет') + '<br>' +
      '<b>Кука сессионная:</b> ' + (has('probe_session') ? 'есть' : 'нет') + '<br>' +
      '<b>localStorage:</b> ' + (ls() || 'нет');
  };
  document.getElementById('set').onclick = () => {
    document.cookie = 'probe_persistent=1; Max-Age=31536000; path=/; SameSite=Lax; Secure';
    document.cookie = 'probe_session=1; path=/; SameSite=Lax; Secure';
    try { localStorage.setItem('probe', 'есть'); } catch (e) {}
    show();
  };
  show();
</script>
</body>
</html>
